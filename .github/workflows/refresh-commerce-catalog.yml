name: Refresh commerce catalog

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Optional published Google Sheet, JSON or CSV URL
        required: false
        type: string
  repository_dispatch:
    types: [commerce-catalog-update]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate storefront and catalogs
        env:
          INPUT_SOURCE: ${{ github.event.client_payload.source_url || inputs.source_url }}
          PRODUCT_SHEET_CSV_URL: ${{ secrets.PRODUCT_SHEET_CSV_URL }}
        run: |
          if [ -n "$INPUT_SOURCE" ]; then
            node scripts/build-commerce-engine.mjs --source "$INPUT_SOURCE"
          else
            node scripts/build-commerce-engine.mjs
          fi

      - name: Validate catalog engine
        run: node --test tests/catalog.test.mjs

      - name: Commit generated outputs
        run: |
          git config user.name "eStack Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html ig shop assets/bullion-store.js assets/bullion-store.css data/products catalog.csv catalog.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Refresh commerce catalog"
          git push

