name: Notify Bing IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for Netlify publish
        run: sleep 75
      - name: Submit changed public URLs to IndexNow
        env:
          HOST: estack.ca
          KEY: e8d613063781fdd0057c384f4b702787
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs'),{execSync}=require('child_process');
          const host=process.env.HOST,key=process.env.KEY;
          let files=[];
          try {
            const before=process.env.BEFORE;
            if (before && !/^0+$/.test(before)) files=execSync(`git diff --name-only ${before} ${process.env.AFTER}`).toString().trim().split(/\n+/).filter(Boolean);
            else files=execSync('git ls-files').toString().trim().split(/\n+/).filter(Boolean);
          } catch { files=[]; }
          const urls=new Set([`https://${host}/`,`https://${host}/sitemap.xml`]);
          for(const f of files){
            if(!/\.(html|xml)$/i.test(f)) continue;
            if(f==='index.html') urls.add(`https://${host}/`);
            else if(f.endsWith('/index.html')) urls.add(`https://${host}/${f.slice(0,-10)}`);
            else urls.add(`https://${host}/${f}`);
          }
          const payload={host,key,keyLocation:`https://${host}/${key}.txt`,urlList:[...urls].slice(0,10000)};
          fs.writeFileSync('/tmp/indexnow.json',JSON.stringify(payload));
          console.log(`Submitting ${payload.urlList.length} URL(s) to IndexNow`);
          NODE
          curl --fail-with-body -sS -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json https://api.indexnow.org/indexnow
